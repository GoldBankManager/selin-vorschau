    <!--
      INDEXIERUNGSSPERRE — nicht entfernen, solange die Seite Kaltakquise ist.

      Selin weiss nichts von dieser Vorschau. Eine indexierte Seite mit ihrem
      Namen, ihrer Adresse und ihren Bewertungen, die ihr nicht gehoert, waere
      ein echtes Problem — markenrechtlich und persoenlich. Erst freigeben,
      wenn ein Auftrag vorliegt. Dieselbe Sperre steht in public/robots.txt.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <!--
      Sicherheitsregeln, soweit sie im Dokument selbst wirken.

      `style-src` braucht 'unsafe-inline': React und die Bewegungsbibliothek
      schreiben ihre Werte in das style-Attribut, das laesst sich ohne
      Umschreiben der halben Anwendung nicht vermeiden. Skripte laufen
      dagegen ausschliesslich aus eigener Quelle — der Weg, ueber den
      eingeschleuster Code tatsaechlich laeuft, ist damit zu.

      `frame-ancestors` und `form-action` werden in einem meta-Element vom
      Browser ignoriert. Sie stehen hier als Vorlage: Beim Livegang gehoeren
      alle diese Regeln als HTTP-Kopfzeilen auf den Server, zusammen mit
      Strict-Transport-Security.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        frame-ancestors 'none';
        form-action 'self';
        img-src 'self' data:;
        font-src 'self' https://fonts.bunny.net;
        style-src 'self' 'unsafe-inline' https://fonts.bunny.net;
        script-src 'self';
        connect-src 'self';
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
